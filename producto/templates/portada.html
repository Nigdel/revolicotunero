{% extends 'base.html' %}
{% block body%}
<div class="row">
    <div class="col col-lg-4 py-5">
        <div class=" border rounded p-4">
            <h5 class="">Nuevo Producto</h5>
            <div class="p-1">
                <form class="p-1" action="/" method="post">{% csrf_token %}
                    <div class="form-group row">
                        <label for="codigo">Codigo</label>
                        <input type="number" class="form-control" name="codigo" placeholder="codigo" />
                    </div>
                    <div class="form-group row">
                        <label for="nombre">Nombre</label>
                        <input type="text" class="form-control" name="nombre" placeholder="nombre" />
                    </div>
                    <div class="form-group row">
                        <label for="precio">precio</label>
                        <input type="number" class="form-control" name="precio" placeholder="precio" />
                    </div>
                    <div class="form-group row">
                        <label for="cantidad">cantidad</label>
                        <input type="number" class="form-control" name="cantidad" placeholder="cantidad" />
                    </div>

                    <input type="submit" class="btn btn-success btn-sm text-light" value="Guardar" />
                </form>

            </div>

        </div>

    </div>
    <div class="col-lg-8">
        <h2>Productos</h2>
        <div class="table-responsive">
            <table class="table table-striped table-sm">
                <tr>
                    <th>codigo</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th colspan="3">Acciones</th>
                </tr>
                {% for p in productos %}
                <tr>
                    <td>{{p.codigo}}</td>
                    <td>{{p.nombre}}</td>
                    <td>{{p.precio}}</td>
                    <td>{{p.cantidad}}</td>
                    <td><a href="comprar/{{p.codigo}}" class="btn btn-success">Comprar</a></td>
                    <td><a href="editar/{{p.codigo}}" class="btn btn-warning">Editar</a></td>
                    <td><a href="eliminar/{{p.codigo}}" class="btn btn-danger">Eliminar</a></td>
                </tr>
                {% endfor %}


            </table>
        </div>
    </div>
</div>




{% endblock %}
